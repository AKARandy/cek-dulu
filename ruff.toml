line-length = 100
target-version = "py311"
exclude = [".models", ".venv", "data", "docs", "demo_work"]

[lint]
select = ["E", "F", "I", "W", "UP", "B"]

[lint.per-file-ignores]
"app/api.py" = ["B008"]  # FastAPI's File(...)/Query(...) argument defaults are the framework idiom

[format]
quote-style = "double"
