name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Complete lightweight test set: every import the weight-free suite
      # touches, proven by scripts/prove_ci_deps.sh locally. No model deps
      # (torch/paddle/transformers) and no weights are needed for unit tests.
      - run: >
          pip install ruff pytest httpx fastapi python-multipart pillow numpy gradio
      - run: ruff check .
      - run: python scripts/generate_golden.py
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cek-dulu:ci .
